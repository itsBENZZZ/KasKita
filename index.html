<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KasKita - Catat Kas</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:Poppins,sans-serif;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:0}
</style>
</head>
<body class="bg-[#0F1A14] text-white min-h-screen p-3 md:p-6 flex flex-col">
<div class="max-w-5xl mx-auto w-full flex-1">
  <!-- HEADER KASKITA -->
  <div class="flex justify-between items-center mb-5">
    <div class="flex gap-3 items-center">
      <div class="w-11 h-11 rounded-2xl bg-[#1DB99A] flex items-center justify-center text-xl font-bold shadow-lg shadow-[#1DB99A]/20">$</div>
      <div>
        <h1 class="text-2xl md:text-3xl font-bold leading-none">KasKita</h1>
        <p class="text-zinc-400 text-[11px] md:text-xs mt-1">Catat kas tanpa drama - Bulanan</p>
      </div>
    </div>
    <div class="text-[10px] bg-[#1E2E2A] border border-zinc-800 px-3 py-1.5 rounded-full">v5 CASH/TF</div>
  </div>

  <!-- CONTROLS -->
  <div class="flex flex-col md:flex-row gap-2 mb-4">
    <select id="monthSelect" class="flex-1 bg-[#1E2E2A] border border-zinc-800 p-3 rounded-2xl text-sm outline-none focus:border-[#1DB99A]"></select>
    <div class="flex gap-2">
      <div class="flex-1 md:w-44 relative">
        <span class="absolute left-3 top-3.5 text-xs text-zinc-500">Rp</span>
        <input id="nominal" type="number" min="0" value="10000" class="w-full bg-[#1E2E2A] border border-zinc-800 p-3 pl-8 rounded-2xl text-sm outline-none focus:border-[#1DB99A]">
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-3">
    <div class="bg-[#1E2E2A] p-4 rounded-2xl border border-zinc-800/50"><p class="text-[10px] text-zinc-400 uppercase tracking-wider">Terkumpul</p><p id="total" class="font-bold text-lg text-[#1DB99A] truncate">Rp 0</p><p id="breakdown" class="text-[10px] text-zinc-500 mt-1">Cash 0 • TF 0</p></div>
    <div class="bg-[#1E2E2A] p-4 rounded-2xl border border-zinc-800/50"><p class="text-[10px] text-zinc-400 uppercase tracking-wider">Sudah / Total</p><p id="sudah" class="font-bold text-lg">0/0</p></div>
    <div class="bg-[#1E2E2A] p-4 rounded-2xl border border-zinc-800/50"><p class="text-[10px] text-zinc-400 uppercase tracking-wider">Target</p><p id="target" class="font-bold text-lg truncate">Rp 0</p></div>
    <div class="bg-[#1E2E2A] p-4 rounded-2xl border border-zinc-800/50"><p class="text-[10px] text-zinc-400 uppercase tracking-wider">Periode</p><p id="periode" class="font-bold text-[13px]">-</p><div class="w-full bg-zinc-800 h-2 rounded-full mt-2"><div id="progress" class="bg-[#1DB99A] h-2 rounded-full transition-all duration-500" style="width:0%"></div></div></div>
  </div>

  <div class="grid md:grid-cols-[1.2fr_0.8fr] gap-3 mb-4">
    <div class="bg-[#1E2E2A] p-4 rounded-2xl border border-zinc-800/50">
      <p class="font-bold mb-3 text-sm">📊 Grafik 6 Bulan (Cash vs TF)</p>
      <div id="chart" class="flex items-end gap-2 h-24"></div>
      <div class="flex items-center gap-3 mt-4"><div class="w-14 h-14 rounded-full flex items-center justify-center font-bold text-sm shrink-0" id="donut">0%</div><p class="text-xs text-zinc-400" id="donutText">0% lunas</p></div>
    </div>
    <div class="bg-[#1E2E2A] p-4 rounded-2xl border border-zinc-800/50 overflow-auto max-h-[230px]">
      <p class="font-bold mb-3 text-sm">📋 Rekap</p>
      <table class="w-full text-[11px]"><thead class="text-zinc-400 sticky top-0 bg-[#1E2E2A]"><tr><th class="text-left p-2">Bulan</th><th class="p-2">Cash</th><th class="p-2">TF</th><th class="p-2 text-right">Total</th></tr></thead><tbody id="rekap"></tbody></table>
    </div>
  </div>

  <!-- FILTER -->
  <div class="flex flex-col sm:flex-row gap-2 mb-3">
    <input id="search" placeholder="Cari nama..." class="flex-1 bg-[#1E2E2A] border border-zinc-800 p-3 rounded-2xl text-sm outline-none focus:border-[#1DB99A]">
    <div class="flex gap-2 overflow-auto">
      <button onclick="setFilter('all')" id="fAll" class="bg-[#1DB99A] px-4 py-2.5 rounded-full text-xs font-bold shrink-0">Semua</button>
      <button onclick="setFilter('cash')" id="fCash" class="bg-[#1E2E2A] border border-zinc-800 px-4 py-2.5 rounded-full text-xs shrink-0">💵 Cash</button>
      <button onclick="setFilter('transfer')" id="fTf" class="bg-[#1E2E2A] border border-zinc-800 px-4 py-2.5 rounded-full text-xs shrink-0">🏦 TF</button>
      <button onclick="setFilter('unpaid')" id="fUnpaid" class="bg-[#1E2E2A] border border-zinc-800 px-4 py-2.5 rounded-full text-xs shrink-0">Belum</button>
    </div>
  </div>

  <div id="list" class="space-y-2 mb-4"></div>

  <div class="flex gap-2 mb-5">
    <input id="newName" placeholder="Nama baru..." class="flex-1 bg-[#1E2E2A] border border-zinc-800 p-3 rounded-2xl text-sm outline-none focus:border-[#1DB99A]">
    <button onclick="addMember()" class="bg-[#1DB99A] hover:bg-[#19a88b] px-6 py-3 rounded-2xl font-bold text-sm">+ Tambah</button>
  </div>

  <div class="grid grid-cols-3 gap-2">
    <button onclick="exportJSON()" class="bg-zinc-800 p-3 rounded-2xl text-[11px]">⬇️ Backup</button>
    <label class="bg-zinc-800 p-3 rounded-2xl text-[11px] text-center cursor-pointer">⬆️ Import<input type="file" id="importFile" hidden accept=".json" onchange="importJSON(event)"></label>
    <button onclick="exportWA()" class="bg-[#1DB99A] p-3 rounded-2xl text-[11px] font-bold">📱 WA</button>
  </div>
</div>

<!-- FOOTER BARU -->
<footer class="text-center mt-8 pb-4">
  <p class="text-[11px] text-zinc-500">by <span class="text-zinc-300 font-semibold">Beben</span> dan <span class="text-[#1DB99A] font-semibold">Meta</span> © 2026</p>
  <p class="text-[10px] text-zinc-600 mt-1">KasKita • ijon edition</p>
</footer>

<script>
const bulan=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
let members=[]; let pays={}; let filter='all';
try{members=JSON.parse(localStorage.getItem('ck_members')||'[{"id":1,"name":"Alya"},{"id":2,"name":"Budi"},{"id":3,"name":"Citra"},{"id":4,"name":"Dito"},{"id":5,"name":"Eka"}]');}catch(e){members=[{id:1,name:"Alya"}]}
try{pays=JSON.parse(localStorage.getItem('ck_pays')||'{}');}catch(e){pays={}}

const sel=document.getElementById('monthSelect');
const dNow=new Date();
const nowKey=`${dNow.getFullYear()}-${String(dNow.getMonth()+1).padStart(2,'0')}`;
for(let y=2023;y<=2045;y++){for(let m=0;m<12;m++){let v=`${y}-${String(m+1).padStart(2,'0')}`;let o=document.createElement('option');o.value=v;o.textContent=`${bulan[m]} ${y}`;if(v===nowKey)o.selected=true;sel.appendChild(o);}}
sel.addEventListener('change',render);
document.getElementById('search').addEventListener('input',render);
document.getElementById('nominal').addEventListener('input',e=>{if(e.target.value<0)e.target.value=0;render();});
document.getElementById('newName').addEventListener('keydown',e=>{if(e.key==='Enter')addMember();});

function save(){localStorage.setItem('ck_members',JSON.stringify(members));localStorage.setItem('ck_pays',JSON.stringify(pays));}
function getKey(){return sel.value;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function addMember(){
  let el=document.getElementById('newName'); let n=el.value.trim();
  if(!n)return alert('Nama gak boleh kosong ta!');
  if(members.some(m=>m.name.toLowerCase()===n.toLowerCase()))return alert('Nama udah ada!');
  members.push({id:Date.now(),name:n}); el.value=''; save(); render();
}
function deleteMember(id){
  let m=members.find(x=>x.id===id); if(!m)return;
  if(!confirm(`Hapus ${m.name}?`))return;
  members=members.filter(x=>x.id!==id);
  Object.keys(pays).forEach(k=>{ if(pays[k]&&pays[k][id]){delete pays[k][id]; if(Object.keys(pays[k]).length===0)delete pays[k];} });
  save(); render();
}
function editMember(id){
  let m=members.find(x=>x.id===id); let baru=prompt('Ganti nama:',m.name); if(baru===null)return;
  baru=baru.trim(); if(!baru)return;
  if(members.some(x=>x.id!==id && x.name.toLowerCase()===baru.toLowerCase()))return alert('Nama udah dipakai orang lain!');
  m.name=baru; save(); render();
}
// TOGGLE CYCLE: null -> cash -> transfer -> null
function toggle(id){
  let k=getKey(); if(!pays[k])pays[k]={};
  let cur=pays[k][id];
  if(!cur?.paid){
    pays[k][id]={paid:true,method:'cash',date:new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'short'})};
  }else if(cur.method==='cash'){
    pays[k][id]={...cur,method:'transfer'};
  }else{
    delete pays[k][id];
    if(Object.keys(pays[k]).length===0)delete pays[k];
  }
  save(); render();
}
function setMethod(id,method){
  let k=getKey(); if(!pays[k]||!pays[k][id])return;
  pays[k][id].method=method; save(); render();
}
function setFilter(f){
  filter=f;
  const base='px-4 py-2.5 rounded-full text-xs shrink-0 transition border ';
  document.getElementById('fAll').className=base+(f==='all'?'bg-[#1DB99A] border-[#1DB99A] font-bold':'bg-[#1E2E2A] border-zinc-800');
  document.getElementById('fCash').className=base+(f==='cash'?'bg-[#1DB99A] border-[#1DB99A] font-bold':'bg-[#1E2E2A] border-zinc-800');
  document.getElementById('fTf').className=base+(f==='transfer'?'bg-[#1DB99A] border-[#1DB99A] font-bold':'bg-[#1E2E2A] border-zinc-800');
  document.getElementById('fUnpaid').className=base+(f==='unpaid'?'bg-[#1DB99A] border-[#1DB99A] font-bold':'bg-[#1E2E2A] border-zinc-800');
  render();
}
function render(){
  let k=getKey(); let nom=parseInt(document.getElementById('nominal').value)||0;
  let q=document.getElementById('search').value.toLowerCase().trim();
  let paid=pays[k]||{};
  let filtered=members.filter(m=>m.name.toLowerCase().includes(q));
  let filteredByStatus=filtered.filter(m=>{
    if(filter==='cash')return paid[m.id]?.paid && paid[m.id]?.method==='cash';
    if(filter==='transfer')return paid[m.id]?.paid && paid[m.id]?.method==='transfer';
    if(filter==='unpaid')return !paid[m.id]?.paid;
    return true;
  });
  let vals=Object.values(paid);
  let sudah=vals.filter(x=>x?.paid).length;
  let cashCount=vals.filter(x=>x?.paid && x.method==='cash').length;
  let tfCount=vals.filter(x=>x?.paid && x.method==='transfer').length;
  let total=members.length; let terkumpul=sudah*nom;
  document.getElementById('total').textContent='Rp '+terkumpul.toLocaleString('id-ID');
  document.getElementById('breakdown').textContent=`Cash ${cashCount} • TF ${tfCount}`;
  document.getElementById('sudah').textContent=sudah+'/'+total;
  document.getElementById('target').textContent='Rp '+(total*nom).toLocaleString('id-ID');
  document.getElementById('periode').textContent=sel.options[sel.selectedIndex]?.textContent||'-';
  document.getElementById('progress').style.width=(total?(sudah/total*100):0)+'%';

  document.getElementById('list').innerHTML=filteredByStatus.length?filteredByStatus.map(m=>{
    let p=paid[m.id]; let isPaid=!!p?.paid;
    let badge=isPaid ? (p.method==='cash' ? '💵 Cash' : '🏦 Transfer') : 'Belum';
    let badgeColor=isPaid ? (p.method==='cash' ? 'bg-amber-500/20 text-amber-300 border-amber-500/30' : 'bg-sky-500/20 text-sky-300 border-sky-500/30') : 'bg-zinc-800 text-zinc-500 border-zinc-700';
    return `<div class="bg-[#1E2E2A] border border-zinc-800/50 p-3 rounded-2xl flex justify-between items-center gap-2">
      <div class="flex gap-3 items-center min-w-0">
        <div class="w-9 h-9 rounded-full bg-zinc-700 flex items-center justify-center text-xs font-bold shrink-0">${esc(m.name[0].toUpperCase())}</div>
        <div class="min-w-0"><p class="text-sm font-semibold truncate">${esc(m.name)}</p><p class="text-[11px] ${isPaid?'text-[#1DB99A]':'text-zinc-500'}">${isPaid?badge+' • '+p.date:'Belum bayar'}</p></div>
      </div>
      <div class="flex gap-1.5 shrink-0 items-center">
        <div class="hidden sm:flex gap-1 mr-1 ${!isPaid?'opacity-30 pointer-events-none':''}">
          <button onclick="setMethod(${m.id},'cash')" class="w-7 h-7 rounded-full text-[11px] ${p?.method==='cash'?'bg-amber-500 text-black font-bold':'bg-zinc-800'}">💵</button>
          <button onclick="setMethod(${m.id},'transfer')" class="w-7 h-7 rounded-full text-[11px] ${p?.method==='transfer'?'bg-sky-500 text-black font-bold':'bg-zinc-800'}">🏦</button>
        </div>
        <button onclick="editMember(${m.id})" class="w-8 h-8 bg-zinc-800 rounded-full text-[12px]">✏️</button>
        <button onclick="deleteMember(${m.id})" class="w-8 h-8 bg-red-500/10 text-red-400 rounded-full text-[12px]">🗑️</button>
        <button onclick="toggle(${m.id})" class="px-3.5 py-1.5 rounded-full text-xs font-bold border ${isPaid?badgeColor:'bg-zinc-700 border-zinc-600'}">${isPaid? (p.method==='cash'?'Cash':'TF') : 'Bayar'}</button>
      </div>
    </div>`;
  }).join(''):`<div class="bg-[#1E2E2A] border border-dashed border-zinc-700 p-6 rounded-2xl text-center text-sm text-zinc-500">Gak ada data.</div>`;

  let perc=total?Math.round(sudah/total*100):0;
  document.getElementById('donut').style.background=`conic-gradient(#1DB99A ${perc}%, #2a2a2a ${perc}%)`;
  document.getElementById('donut').textContent=perc+'%';
  document.getElementById('donutText').textContent=perc+'% lunas • Cash:'+cashCount+' TF:'+tfCount;

  let chart=document.getElementById('chart'); chart.innerHTML='';
  for(let i=5;i>=0;i--){
    let d=new Date(k+'-01T00:00:00'); d.setMonth(d.getMonth()-i);
    let key=d.toISOString().slice(0,7);
    let v=pays[key]?Object.values(pays[key]):[];
    let s=v.filter(x=>x?.paid).length;
    let cash=v.filter(x=>x?.method==='cash').length;
    let tf=v.filter(x=>x?.method==='transfer').length;
    let hCash=total?Math.max(0,(cash/total)*80):0;
    let hTf=total?Math.max(0,(tf/total)*80):0;
    let hTotal=hCash+hTf; if(s===0) hTotal=0;
    chart.innerHTML+=`<div class="flex-1 flex flex-col items-center gap-1 justify-end h-full"><div class="w-full flex flex-col rounded-t-lg overflow-hidden" style="height:${hTotal||4}px"><div class="bg-amber-400" style="height:${hCash}px"></div><div class="bg-sky-400" style="height:${hTf}px"></div>${s===0?'<div class="bg-zinc-800 w-full h-1"></div>':''}</div><span class="text-[10px] text-zinc-500">${bulan[d.getMonth()].slice(0,3)}</span></div>`;
  }

  let rekap=document.getElementById('rekap');
  let keys=Object.keys(pays).sort().reverse().slice(0,12);
  rekap.innerHTML=keys.length?keys.map(kk=>{
    let v=Object.values(pays[kk]); let c=v.filter(x=>x.method==='cash').length; let t=v.filter(x=>x.method==='transfer').length;
    return `<tr class="border-t border-zinc-800/60"><td class="p-2.5">${kk}</td><td class="p-2.5 text-center text-amber-300">${c}</td><td class="p-2.5 text-center text-sky-300">${t}</td><td class="p-2.5 text-right">Rp ${((c+t)*nom).toLocaleString('id-ID')}</td></tr>`;
  }).join(''):`<tr><td colspan="4" class="p-4 text-center text-zinc-500">Belum ada transaksi</td></tr>`;
}
function exportJSON(){
  let blob=new Blob([JSON.stringify({members,pays,nominal:document.getElementById('nominal').value},null,2)],{type:'application/json'});
  let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kaskita-backup-'+getKey()+'.json';a.click();
}
function importJSON(e){
  let file=e.target.files[0]; if(!file)return;
  let r=new FileReader(); r.onload=ev=>{
    try{let d=JSON.parse(ev.target.result); if(!d.members||!Array.isArray(d.members))throw new Error('format salah'); members=d.members; pays=d.pays||{}; if(d.nominal)document.getElementById('nominal').value=d.nominal; save(); render(); alert('Import berhasil!');}catch(err){alert('File rusak: '+err.message);}
  }; r.readAsText(file); e.target.value='';
}
function exportWA(){
  let k=getKey(); let paid=pays[k]||{}; let nom=parseInt(document.getElementById('nominal').value)||0;
  let sudahCash=members.filter(m=>paid[m.id]?.method==='cash').map(m=>m.name);
  let sudahTf=members.filter(m=>paid[m.id]?.method==='transfer').map(m=>m.name);
  let belum=members.filter(m=>!paid[m.id]?.paid).map(m=>m.name);
  let t=`*KasKita ${sel.options[sel.selectedIndex].textContent}*\n\n💵 Cash (${sudahCash.length}): ${sudahCash.join(', ')||'-'}\n🏦 Transfer (${sudahTf.length}): ${sudahTf.join(', ')||'-'}\n❌ Belum (${belum.length}): ${belum.join(', ')||'-'}\n\n💰 Terkumpul: Rp ${((sudahCash.length+sudahTf.length)*nom).toLocaleString('id-ID')}`;
  navigator.clipboard.writeText(t).then(()=>alert('Tersalin!')).catch(()=>{prompt('Copy manual:',t);});
}
render();
</script>
</body>
</html>
